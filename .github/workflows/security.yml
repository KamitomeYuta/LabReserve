name: Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4

  image:
    name: Scan production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build --pull --tag labreserve:scan .
      - name: Check runtime dependencies as the application user
        run: |
          docker run --rm labreserve:scan node --input-type=module -e "
            import assert from 'node:assert/strict';
            import argon2 from 'argon2';
            import { createApp } from './apps/api/dist/apps/api/src/app.js';
            assert.equal(typeof createApp, 'function');
            assert.equal(await argon2.verify(await argon2.hash('test'), 'test'), true);
            assert.notEqual(process.getuid(), 0);
          "
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: labreserve:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/trivy.json
      - name: Report findings and fail on fixable vulnerabilities
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "trivy.json").read_text())
          fixable = 0
          for result in report["Results"]:
              for issue in result.get("Vulnerabilities") or []:
                  fix = issue.get("FixedVersion")
                  print(result["Target"], issue["Severity"], issue["VulnerabilityID"], issue["PkgName"],
                        issue["InstalledVersion"], "->", fix or "no fix listed")
                  if fix:
                      fixable += 1
          if fixable:
              raise SystemExit(f"{fixable} HIGH/CRITICAL findings have a fix available")
