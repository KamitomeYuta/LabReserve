name: labreserve
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labreserve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labreserve_local}
      POSTGRES_DB: labreserve
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labreserve -d labreserve']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://labreserve:${POSTGRES_PASSWORD:-labreserve_local}@db:5432/labreserve
      APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:3000}
      CSRF_SECRET: ${CSRF_SECRET:-local-compose-only-secret-replace-for-production-123456}
      PORT: '3000'
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'node apps/api/dist/apps/api/scripts/migrate.js && node apps/api/dist/apps/api/src/server.js',
      ]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
